name: binance_autotrader
description: Binance crypto auto-trading bot for Android
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Networking
  http: ^1.2.2
  web_socket_channel: ^3.0.2
  dio: ^5.7.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Security
  flutter_secure_storage: ^9.2.4

  # Background processing
  flutter_background_service: ^5.0.9
  flutter_background_service_android: ^6.2.4

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Charts
  fl_chart: ^0.70.2
  candlesticks: ^2.1.0
  webview_flutter: ^4.10.0

  # Utilities
  crypto: ^3.0.5
  intl: ^0.20.2
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.1
  uuid: ^4.5.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
